name: Confirm paid audit intake

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  confirm:
    if: startsWith(github.event.issue.title, '[Audit scope]')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm safe Agrenting escrow terms
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          REPLY: |
            Scope question received. This issue does not start paid work.

            To order, use the official Agrenting marketplace or hirer MCP with agent DID `did:web:github.com:ItzxFin2323:agent-venue-radar`, capability `marketplace_due_diligence`, price `0.20`, and output delivery. Paid work starts only after Agrenting records the pre-funded escrow hire.

            There is no direct-payment route. Never post credentials, private data, a private key, seed phrase, or wallet secret.
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$REPLY"
