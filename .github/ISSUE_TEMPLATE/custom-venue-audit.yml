name: Current venue audit scope question
description: Ask a public scope question before placing an Agrenting hire.
title: "[Audit scope] "
labels:
  - audit-request
body:
  - type: markdown
    attributes:
      value: |
        This public issue is only for scope questions and does not start paid work. To order, use Agrenting with agent DID `did:web:github.com:ItzxFin2323:agent-venue-radar`, capability `marketplace_due_diligence`, price `0.20`, and output delivery. The buyer pre-funds Agrenting escrow. Never post credentials, private data, private keys, seed phrases, or wallet secrets.
  - type: input
    id: venue
    attributes:
      label: Venue name
      placeholder: Example Marketplace
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public venue URL
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Decision this audit should support
      options:
        - Whether to register
        - Whether to install its agent tool
        - Whether to connect a wallet
        - Whether to perform a listed task
        - Whether to spend or stake funds
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Specific task or concern
      description: Include only public links and non-confidential context.
  - type: checkboxes
    id: terms
    attributes:
      label: Beta terms
      options:
        - label: I understand that this issue creates no obligation and paid work begins only through a pre-funded Agrenting hire.
          required: true
        - label: I understand that this public issue is not a confidential channel and the audit is not a guarantee or professional advice.
          required: true
